<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>한강각 · 종목 선택</title>
<style>*{box-sizing:border-box}body{font:16px system-ui;background:#162b31;color:#f5eee4;max-width:480px;margin:0 auto;padding:24px 20px max(20px,env(safe-area-inset-bottom));line-height:1.5}h1{font-size:28px;margin:0}p{color:#c4d5d1;font-size:14px;margin:8px 0 16px}label{font-size:14px}input[type=search]{display:block;width:100%;min-height:48px;margin:8px 0;font:inherit;padding:12px;background:#244048;color:white;border:1px solid #9cb5b6;border-radius:12px}button{font:inherit;cursor:pointer;min-height:46px}#stock-list[hidden],#selection:empty{display:none}.stock-row small{margin:2px 0 0}.stock-row>span{min-width:0;overflow-wrap:anywhere}#stock-list{max-height:220px;overflow:auto;border:1px solid #ffffff28;border-radius:12px}.stock-row{display:flex;justify-content:space-between;gap:12px;width:100%;padding:12px;border:0;border-bottom:1px solid #ffffff16;background:#1d373d;color:#eef4ec;text-align:left}.stock-row[aria-pressed=true]{background:#385a5e;box-shadow:inset 3px 0 #c7e5da}.up{color:#ff9a9a}.down{color:#8dc7ff}fieldset{display:flex;gap:20px;margin:16px 0;border:0;padding:0}fieldset label{display:flex;align-items:center;gap:6px;min-height:44px}legend{font-size:14px}#stock-enter{width:100%;padding:12px;border:0;border-radius:12px;background:#e3e8d6;color:#173339;font-weight:700}button:disabled{opacity:.45;cursor:default}#selection{min-height:22px;margin:10px 0;font-size:13px}small{display:block;color:#b5c9c5;font-size:12px;margin-top:12px}button:focus-visible,input:focus-visible{outline:3px solid #9bd5e1;outline-offset:2px}.stock-row .room-count{flex:none;align-self:center;font-size:13px;color:#c9e6d9;font-variant-numeric:tabular-nums}</style>
<h1>한강각</h1><p>플러스·보합은 라운지, 마이너스는 한강.</p>
<label for="choose-stock">종목명 또는 코드</label><input id="choose-stock" type="search" placeholder="예: 삼성전자, 005930" autocomplete="off"><p id="selection" role="status"></p><div id="stock-list" aria-label="종목 목록" hidden></div>

<button id="stock-enter" disabled>선택한 종목으로 입장</button><small>입장한 방의 시세는 장중 1분 간격으로 갱신됩니다.</small><script type="module" src="./stock-entry.js?v=3360e585ee3ee520d254771bd08cf9a7d0d5d385"></script></html>
